services:
  # Backend FastAPI Web Service
  - type: web
    name: rxresolve-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: rxresolve
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # Frontend Static Site
  - type: web
    name: rxresolve-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rxresolve-api
          property: host
